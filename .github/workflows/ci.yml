# Hush — CI gate (mobile).
#
# The product is the React Native / Expo app in code/mobile (the live v4 engine runs there).
# The dormant Python Bayesian backend was decommissioned (see V4_CLEANUP_PROPOSAL.md), so CI now
# gates the mobile app: type-check + the full Jest suite (engine invariants, sims, flows, laws).
name: hush-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  mobile:
    name: mobile typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: code/mobile/package-lock.json

      - name: Install dependencies (exact lockfile closure)
        run: npm ci

      - name: Type-check (tsc, no emit)
        run: npx tsc --noEmit

      - name: Test (full Jest suite)
        run: npx jest --ci
