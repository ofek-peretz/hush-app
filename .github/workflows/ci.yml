# Hush — CI gate (mobile + the Cloudflare workers).
#
# The product is the React Native / Expo app in code/mobile (the live v4 engine runs there).
# The dormant Python Bayesian backend was decommissioned (see V4_CLEANUP_PROPOSAL.md). CI gates
# the mobile app (type-check + the full Jest suite) AND, since 2026-09-01, the two live workers
# in server/ — which shipped for months with zero coverage until the audit's finding 6.
name: hush-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  mobile:
    name: mobile typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: code/mobile/package-lock.json

      - name: Install dependencies (exact lockfile closure)
        run: npm ci

      - name: Type-check (tsc, no emit)
        run: npx tsc --noEmit

      # ⛔ THE REPO'S OWN CHECKERS, WHICH CI DID NOT RUN UNTIL 2026-08-26. Both are real gates — the
      # voice laws and the Hebrew completeness on one side, the RTL/physical-edge rules on the other
      # — and neither was wired to anything, so the RTL one was found holding two violations that had
      # aged a full session. `everyLintTheRepoShipsIsRun` holds the same pair locally.
      - name: Copy laws (voice, Hebrew completeness, plurals)
        run: npm run lint:copy

      - name: RTL / physical-edge lint
        run: npm run lint:rtl

      # ⛔ ADDED 2026-08-31, after the founder's crash: *"בעת יציאה ממסך האימון בתחילת האימון
      # האפליקציה קורסת."* A guard placed one line above a `useState` changed the hook count on the
      # frame a session ends, and React THROWS on that. There is no eslint in this repo to hold the
      # rule, so the repo holds it the way it holds its other two.
      - name: Hook-order lint (a hook below a conditional return crashes the app)
        run: npm run lint:hooks

      # ⛔ `--maxWorkers=4` IS PART OF THE VERDICT, not an optimisation (2026-09-01). A bare
      # `npx jest` on a starved runner fakes stage-suite timeouts — the heavy law suites need the
      # four workers to finish inside their own budgets, and a red that means "the runner was slow"
      # teaches everyone to ignore red.
      - name: Test (full Jest suite)
        run: npx jest --ci --maxWorkers=4

  server:
    # ════ THE WORKERS, DRIVEN FOR REAL (2026-09-01, audit finding 6) ════
    # Both workers are import-free TypeScript; Node 24 strips types natively, so the tests call the
    # actual `fetch` handlers with an in-memory KV — no build step, no framework, no mocks of our
    # own code. The first run of this harness caught a live bug (a '0' kill-switch ceiling falling
    # through `|| 2000` to an unkillable 2000), which is the whole argument for its existence.
    name: workers (identity + coach)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Worker tests (node:test, native TS)
        run: node --test server/tests/identity.test.ts server/tests/coach.test.ts
