# Hush — CI gate (mobile + the Cloudflare workers).
#
# The product is the React Native / Expo app in code/mobile (the live v4 engine runs there).
# The dormant Python Bayesian backend was decommissioned (see V4_CLEANUP_PROPOSAL.md). CI gates
# the mobile app (type-check + the full Jest suite) AND, since 2026-09-01, the two live workers
# in server/ — which shipped for months with zero coverage until the audit's finding 6.
name: hush-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  mobile:
    name: mobile typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: code/mobile/package-lock.json

      - name: Install dependencies (exact lockfile closure)
        run: npm ci

      - name: Type-check (tsc, no emit)
        run: npx tsc --noEmit

      # ⛔ THE REPO'S OWN CHECKERS, WHICH CI DID NOT RUN UNTIL 2026-08-26. Both are real gates — the
      # voice laws and the Hebrew completeness on one side, the RTL/physical-edge rules on the other
      # — and neither was wired to anything, so the RTL one was found holding two violations that had
      # aged a full session. `everyLintTheRepoShipsIsRun` holds the same pair locally.
      - name: Copy laws (voice, Hebrew completeness, plurals)
        run: npm run lint:copy

      - name: RTL / physical-edge lint
        run: npm run lint:rtl

      # ⛔ ADDED 2026-08-31, after the founder's crash: *"בעת יציאה ממסך האימון בתחילת האימון
      # האפליקציה קורסת."* A guard placed one line above a `useState` changed the hook count on the
      # frame a session ends, and React THROWS on that. There is no eslint in this repo to hold the
      # rule, so the repo holds it the way it holds its other two.
      - name: Hook-order lint (a hook below a conditional return crashes the app)
        run: npm run lint:hooks

      # ⛔ `--maxWorkers=4` IS PART OF THE VERDICT, not an optimisation (2026-09-01). A bare
      # `npx jest` on a starved runner fakes stage-suite timeouts — the heavy law suites need the
      # four workers to finish inside their own budgets, and a red that means "the runner was slow"
      # teaches everyone to ignore red.
      - name: Test (full Jest suite)
        run: npx jest --ci --maxWorkers=4

  server:
    # ════ THE WORKERS, DRIVEN FOR REAL (2026-09-01, audit finding 6) ════
    # Both workers are import-free TypeScript; Node 24 strips types natively, so the tests call the
    # actual `fetch` handlers with an in-memory KV — no build step, no framework, no mocks of our
    # own code. The first run of this harness caught a live bug (a '0' kill-switch ceiling falling
    # through `|| 2000` to an unkillable 2000), which is the whole argument for its existence.
    name: workers (identity + coach)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # ⛔ THE COACH WORKER IS NOT IMPORT-FREE ANY MORE (2026-10-05). Since the model bake-off it imports
      # `probeProviders.ts`, which imports two SDKs — and this job never installed them. Every run from
      # the commit that shipped it failed here with ERR_MODULE_NOT_FOUND before one coach test ran, on
      # a branch whose own machine (with `server/node_modules` on disk) was green. Two packages, a lockfile.
      - name: Install the workers' dependencies
        run: npm ci
        working-directory: server
      # All five files, not two: the voice's doors, Google sign-in and the model call are the Worker too.
      - name: Worker tests (node:test, native TS)
        run: node --test server/tests/identity.test.ts server/tests/coach.test.ts server/tests/identityGoogle.test.ts server/tests/voice.test.ts server/tests/openai.test.ts

  swift:
    # ════ THE NATIVE TARGETS, TYPE-CHECKED ON A MAC (2026-09-16, before build 74) ════
    # The watch app, the Live Activity / Today widget and the watch complication are SwiftUI that
    # nothing compiled until an EAS build — a Windows tree cannot. Each target is self-contained
    # (targets/<name>/*.swift), so `swiftc -typecheck` against the real SDKs proves they compile
    # without building, signing or uploading anything.
    name: swift typecheck (watch, widget, complication)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && xcrun --sdk watchos --show-sdk-version && xcrun --sdk iphoneos --show-sdk-version
      - name: Watch app (watchOS 10)
        run: xcrun --sdk watchos swiftc -typecheck -parse-as-library -target arm64_32-apple-watchos10.0 code/mobile/targets/watch/*.swift
      - name: Widget + Live Activity (iOS 17)
        run: xcrun --sdk iphoneos swiftc -typecheck -parse-as-library -target arm64-apple-ios17.0 code/mobile/targets/widget/*.swift
      - name: Watch complication (watchOS 10)
        run: xcrun --sdk watchos swiftc -typecheck -parse-as-library -target arm64_32-apple-watchos10.0 code/mobile/targets/watch-widget/*.swift
      # ════ THE WORKOUT'S MICROPHONE COMPILES FOR EVERY iOS THE APP RUNS ON (2026-10-05) ════
      # `HushEar.swift` is the microphone the strong ear hears through. It used to be one class behind
      # `@available(iOS 26.0, *)`; now only Apple's on-device recognizer inside it is — so the file must
      # type-check at the app's own floor (15.1), where one ungated use of an iOS 26 symbol is an error.
      # It imports nothing but AVFoundation and Speech, so it checks alone. (The module beside it needs
      # ExpoModulesCore and is compiled by the build.)
      - name: Voice coach microphone (iOS 15.1 — the app's floor)
        # The file names iOS 26 symbols (SpeechAnalyzer) behind availability checks, so the SDK must
        # have them: the newest Xcode 26 on the runner is chosen, and a runner without one fails
        # with that sentence — not with forty "cannot find type" errors that read like a broken file.
        #
        # ⚠️ macOS runners run this in bash 3.2: an apostrophe inside a "${VAR:-word}" is a syntax error
        # there (exit 2 before one command runs — which is how this step's first run failed, with
        # nothing in it having been checked). And every compiler error is repeated as an annotation,
        # so a red run can be read from the run's own page.
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort | tail -1 || true)
          if [ -n "$XCODE" ]; then export DEVELOPER_DIR="$XCODE/Contents/Developer"; fi
          echo "Xcode: ${XCODE:-runner default}"
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"
          case "$SDK" in
            2[6-9]*|[3-9][0-9]*) ;;
            *) echo "::error::this runner has no iOS 26 SDK (found $SDK), so HushEar.swift cannot be type-checked here"; exit 1 ;;
          esac
          FILE=code/mobile/modules/hush-voice-audio/ios/HushEar.swift
          set +e
          xcrun --sdk iphoneos swiftc -typecheck -parse-as-library -target arm64-apple-ios15.1 code/mobile/modules/hush-voice-audio/ios/HushEar.swift > typecheck.log 2>&1
          status=$?
          set -e
          cat typecheck.log
          grep -E ":[0-9]+:[0-9]+: error: " typecheck.log | head -10 | sed -E 's/^([^:]+):([0-9]+):([0-9]+): error: (.*)$/::error file=\1,line=\2,col=\3::\4/' || true
          if [ "$status" -ne 0 ]; then echo "::error::swiftc exited $status type-checking $FILE"; fi
          exit $status
      # ════ THE WRIST READS WHAT THE PHONE SAID (2026-09-17) ════
      # The sync simulator (`__tests__/sync/theSurfacesNeverDisagree`) writes the exact envelopes the
      # watch is sent beside the facts the phone's own view states. Decode each with the watch's REAL
      # `WatchWire` on macOS and check every fact — the cross-language half no Windows tree can run.
      - name: Wire fixtures decode on the watch's own parser
        run: |
          xcrun swiftc code/mobile/targets/watch/WatchWire.swift code/mobile/targets/watch/WatchCopy.swift code/mobile/native-tests/wire-fixtures/main.swift -o wirecheck
          ./wirecheck code/mobile/__tests__/sync/__fixtures__
