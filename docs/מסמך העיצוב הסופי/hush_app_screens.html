  .hush-says-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--color-text-secondary);
    margin-bottom: 4px;
    display: flex;
    align-items: center;

  .hush-says-text {

  }

        <div style="width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#2d7dd2,#185fa5);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;">H</div>
        <span style="font-size:12px;font-weight:600;letter-spacing:0.3px;color:rgba(255,255,255,0.75);">HUSH</span>
        <span style="margin-left:auto;font-size:12px;color:rgba(255,255,255,0.5);">now</span>
      </div>
      <div style="font-size:15px;font-weight:600;margin-bottom:3px;">Next week is ready</div>
      <div style="font-size:14px;color:rgba(255,255,255,0.78);line-height:1.4;">I've built your program for next week. Four sessions, tuned to how you trained.</div>
    </div>
    <div style="position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:center;"><div style="width:128px;height:5px;border-radius:3px;background:rgba(255,255,255,0.5);"></div></div>`
  }
];

const SECTIONS=[...new Set(SCREENS.map(s=>s.section))];
let cur=0;

const secTabsEl=document.getElementById('secTabs');
const phoneScreen=document.getElementById('phoneScreen');
const screenNum=document.getElementById('screenNum');
const screenName=document.getElementById('screenName');
const screenTag=document.getElementById('screenTag');
const roleText=document.getElementById('roleText');
const saysText=document.getElementById('saysText');
const colA=document.getElementById('colA');
const colB=document.getElementById('colB');
const dotsRow=document.getElementById('dotsRow');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');

SCREENS.forEach((_,k)=>{
  const d=document.createElement('div');
  d.className='hush-dot';
  d.onclick=()=>{cur=k;render();};
  dotsRow.appendChild(d);
});

SECTIONS.forEach(sec=>{
  const b=document.createElement('button');
  b.className='hush-sec-btn';
  b.textContent=sec;
  b.onclick=()=>{
    const idx=SCREENS.findIndex(s=>s.section===sec);
    if(idx>=0){cur=idx;render();}
  };
  secTabsEl.appendChild(b);
});

function render(){
  const s=SCREENS[cur];
  phoneScreen.innerHTML=s.s;
  screenNum.textContent=`${cur+1}/${SCREENS.length}`;
  screenName.textContent=s.nm;
  screenTag.textContent=s.tag[0];
  screenTag.style.color=s.tag[1];
  screenTag.style.background=s.tag[2];
  roleText.textContent=s.role;
  saysText.textContent=`"${s.says}"`;
  colA.textContent=s.oa;
  colB.textContent=s.ob;
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===SCREENS.length-1;
  [...dotsRow.children].forEach((d,k)=>{
    d.classList.toggle('active',k===cur);
  });
  const curSec=s.section;
  [...secTabsEl.children].forEach(b=>{
    b.classList.toggle('active',b.textContent===curSec);
  });
}

prevBtn.onclick=()=>{if(cur>0){cur--;render();}};
nextBtn.onclick=()=>{if(cur<SCREENS.length-1){cur++;render();}};

render();
</script>
